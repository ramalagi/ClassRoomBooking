services:
  - type: web
    name: classroom-booking
    env: python

    plan: free

    buildCommand: |
      pip install -r requirements.txt

    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT

    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9

      - key: DATABASE_URL
        sync: false

      - key: SECRET_KEY
        generateValue: true